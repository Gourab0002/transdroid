name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to release (created at the dispatched ref if it doesn't exist)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > transdroid-release.keystore
            {
              echo "storeFile=transdroid-release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "Release signing configured"
          else
            echo "No signing secrets; building unsigned APKs"
          fi

      - name: Test
        run: ./gradlew :protocol:test :app:testFullDebugUnitTest

      - name: Assemble APKs
        run: ./gradlew :app:assembleRelease

      - name: Name release APKs
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/full/release/*.apk "dist/Transdroid-${TAG}.apk"
          cp app/build/outputs/apk/lite/release/*.apk "dist/Transdroid-lite-${TAG}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Transdroid ${{ inputs.tag_name || github.ref_name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **Transdroid 1.0** — signed release APK.

            Install **`Transdroid-v1.0.0.apk`** (full flavor). The lite APK is the
            Google Play / Transdrone variant with in-app search and RSS disabled.
